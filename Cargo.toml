
# ##########################################################
# Package

[package]

authors = [
	"Matt Wilson <matthew@synesis.com.au>",
]
categories = [
	"development-tools",
]
description = "Application-level helpers influenced by C-family scope techniques (for Rust)"
documentation = "https://docs.rs/raiment"
edition = "2021"
exclude = [
	".cargo",
	".cursor",
	".github",
	".vimrc",
	".vscode",
	"scripts",
	"target",
]
homepage = "https://github.com/synesissoftware/raiment"
keywords = [
	"raii",
	"scope",
]
license = "BSD-3-Clause"
name = "raiment"
publish = true
readme = "README.md"
repository = "https://github.com/synesissoftware/raiment"
rust-version = "1.74"
version = "0.0.0"


# ##########################################################
# Targets

[lib]
name = "raiment"
path = "src/lib.rs"


# ##########################################################
# Features

[features]

default = [
]

# General features:
#
# - "_NEVER_TO_BE_ENABLED" - this is a placeholder feature and must NEVER be specified;
# - "null-feature" - a feature that has no effect (and, thus, is useful for simplifying driver scripts);

_NEVER_TO_BE_ENABLED = []
null-feature = []


# Crate-specific features:
#


# ##########################################################
# Dependencies

[build-dependencies]

[dependencies]

[dev-dependencies]


